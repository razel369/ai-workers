name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate Oracle deployment configuration
        run: |
          bash -n deploy/oci/bootstrap.sh deploy/oci/deploy.sh deploy/oci/backup.sh
          docker compose --env-file .env.oci.example -f compose.oci.yaml config --quiet
          docker run --rm \
            -e AI_WORKERS_DOMAIN=ai-workers-ci.example.com \
            -v "$PWD/deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run platform tests
        run: npm test
        env:
          ADMIN_TOKEN: ci-test-admin-token
          LLM_API_KEY: ""
