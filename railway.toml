# HISTORICAL RAILWAY CONFIGURATION — not the current deployment path.
# Do not use this file for a new production service. Use the reviewed Oracle
# Always Free stack in compose.oci.yaml. These retained settings are fail-closed so an old
# linked Railway project cannot become ready without its persistent volume and
# complete production configuration.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[variables]
DB_PATH = "/app/data/earnings.db"
DATA_DIR = "/app/data"
TENANTS_DIR = "/app/data/tenants"
LLM_PROVIDER = "openai_compatible"
TRUST_PROXY_HEADERS = "1"
REQUIRE_PERSISTENT_VOLUME = "1"
TRIAL_DAYS = "0"
# Historical dashboard variables (not committed) must still be explicit:
# PUBLIC_BASE_URL = "https://YOUR-SERVICE.up.railway.app"
# EMBED_ALLOWED_ORIGINS = "https://your-business.example"
# ADMIN_TOKEN = "<generate with: node -e \"console.log(require('crypto').randomBytes(24).toString('hex'))\">"
# LLM_API_KEY = "sk-..."
# BIT_PHONE or PAYPAL_ME = at least one payment channel
# AGENT_OWNER_CONTACT = support@yourdomain.com
#
# Volume (required): Railway Dashboard → Service → Volumes → Mount path /app/data

[deploy]
startCommand = "node --experimental-sqlite --no-warnings server.js"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
