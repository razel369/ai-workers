<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הבית של העובד שלי</title>
<link rel="icon" href="/brand/logo-nightdesk-icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --ok:#059669; --warn:#d97706; --danger:#dc2626;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1115; --card:#171a21; --ink:#f3f4f6; --muted:#9aa3af; --line:#262b34;
           --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 56px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
  .brand{font-weight:700;font-size:15px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:999px}
  .pill.ok{background:rgba(5,150,105,.12);color:var(--ok)}
  .pill.warn{background:rgba(217,119,6,.14);color:var(--warn)}
  .pill.danger{background:rgba(220,38,38,.12);color:var(--danger)}
  .hero{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border:none}
  .hero h1{font-size:20px;margin:0 0 6px;line-height:1.35}
  .hero p{margin:0;opacity:.92;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .kpi{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 8px;text-align:center}
  .kpi b{display:block;font-size:20px;line-height:1.1}
  .kpi span{font-size:11px;opacity:.9}
  @media(max-width:460px){ .kpis{grid-template-columns:repeat(2,1fr)} }
  .row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .row .grow{flex:1;min-width:0}
  .row strong{display:block;font-size:14px;margin-bottom:2px}
  .row .meta{font-size:12px;color:var(--muted);word-break:break-word}
  .acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;
    padding:7px 11px;border-radius:9px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.ghost{background:transparent}
  .empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}
  input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:var(--card);color:var(--ink);direction:rtl}
  input:focus{outline:2px solid var(--brand);outline-offset:-1px}
  .login{max-width:400px;margin:8vh auto;text-align:center}
  .login h1{font-size:21px;margin:0 0 8px}
  .login form{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .notice{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .notice.err{background:rgba(220,38,38,.1);color:var(--danger)}
  .notice.ok{background:rgba(5,150,105,.12);color:var(--ok)}
  .banner{background:rgba(217,119,6,.12);color:var(--warn);border:1px solid rgba(217,119,6,.3)}
  .skel{height:14px;background:var(--line);border-radius:6px;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.45}}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.9}
  footer a{color:var(--muted)}
</style>

<div class="wrap" id="root">
  <div class="card"><div class="skel" style="width:60%"></div></div>
</div>

<script>
(function () {
  'use strict';
  var root = document.getElementById('root');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function csrf() {
    var m = document.cookie.match(/(?:^|;\s*)aiw_session_csrf=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function api(path, opts) {
    opts = opts || {};
    var headers = { 'content-type': 'application/json' };
    if (opts.method && opts.method !== 'GET') headers['x-csrf-token'] = csrf();
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      credentials: 'same-origin',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { status: r.status, body: j };
      });
    });
  }
  function timeAgo(iso) {
    if (!iso) return '';
    var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return 'ממש עכשיו';
    if (mins < 60) return 'לפני ' + mins + ' דק׳';
    var h = Math.floor(mins / 60);
    if (h < 24) return 'לפני ' + h + ' שע׳';
    var d = Math.floor(h / 24);
    return d === 1 ? 'אתמול' : 'לפני ' + d + ' ימים';
  }
  // Israeli numbers are stored as 9725… — render them dialable either way.
  function telHref(p) { return 'tel:' + String(p || '').replace(/[^\d+]/g, ''); }
  function waHref(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (/^0\d{8,9}$/.test(d)) d = '972' + d.slice(1);
    return 'https://wa.me/' + d;
  }

  // ---- Login ----------------------------------------------------------
  var ERRORS = {
    missing_token: 'הקישור לא תקין. בקשו קישור חדש.',
    invalid_token: 'הקישור לא תקין או שכבר נוצל.',
    token_expired: 'הקישור פג תוקף. בקשו קישור חדש.',
    token_already_used: 'הקישור כבר שימש לכניסה. בקשו קישור חדש.'
  };

  function renderLogin(msg, kind) {
    var q = new URLSearchParams(location.search).get('error');
    var note = msg || (q ? (ERRORS[q] || 'לא הצלחנו להכניס אתכם. נסו שוב.') : '');
    root.innerHTML =
      '<div class="login">' +
        '<h1>הבית של העובד שלך</h1>' +
        '<p class="muted">נשלח לכם קוד כניסה — בלי סיסמה לזכור.</p>' +
        (note ? '<div class="notice ' + (kind || 'err') + '" style="margin-top:16px">' + esc(note) + '</div>' : '') +
        '<form id="f">' +
          '<input id="dest" type="text" inputmode="email" autocomplete="username" ' +
            'placeholder="אימייל או טלפון" required>' +
          '<button class="btn primary" style="justify-content:center;padding:13px" type="submit">שלחו לי קוד</button>' +
        '</form>' +
        '<p class="muted" style="margin-top:18px">' +
          'הקוד נשלח לכתובת שרשומה אצלנו לעסק. לא מקבלים? פנו אלינו.' +
        '</p>' +
      '</div>';
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var dest = document.getElementById('dest').value.trim();
      if (!dest) return;
      api('/api/auth/request-link', { method: 'POST', body: { destination: dest } })
        .then(function () { renderCode(dest); });
    });
  }

  function renderCode(dest) {
    root.innerHTML =
      '<div class="login">' +
        '<h1>הזינו את הקוד</h1>' +
        '<p class="muted">שלחנו קוד בן 6 ספרות אל<br><b>' + esc(dest) + '</b></p>' +
        '<div id="msg"></div>' +
        '<form id="f">' +
          '<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" ' +
            'maxlength="6" placeholder="______" required ' +
            'style="text-align:center;letter-spacing:10px;font-size:26px;direction:ltr">' +
          '<button class="btn primary" style="justify-content:center;padding:13px" type="submit">כניסה</button>' +
          '<button class="btn ghost" style="justify-content:center" type="button" id="back">כתובת אחרת</button>' +
        '</form>' +
      '</div>';
    document.getElementById('back').addEventListener('click', function () { renderLogin(); });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var code = document.getElementById('code').value.trim();
      api('/api/auth/verify-code', { method: 'POST', body: { destination: dest, code: code } })
        .then(function (r) {
          if (r.status === 200) { history.replaceState({}, '', '/app'); load(); return; }
          document.getElementById('msg').innerHTML =
            '<div class="notice err">' +
            (r.body.error === 'too_many_attempts'
              ? 'יותר מדי ניסיונות. בקשו קוד חדש.'
              : 'הקוד שגוי או פג תוקף.') + '</div>';
        });
    });
  }

  // ---- Hub ------------------------------------------------------------
  function headline(d) {
    if (d.totals.openEscalations > 0) return d.totals.openEscalations + ' לקוחות מחכים לך';
    if (d.totals.hotLeads > 0) return d.totals.hotLeads + ' לידים חמים מוכנים לפנייה';
    if (d.totals.newLeads > 0) return d.totals.newLeads + ' לידים חדשים השבוע';
    if (d.totals.messagesThisWeek > 0) return d.totals.messagesThisWeek + ' שיחות עם לקוחות השבוע';
    return 'העובד שלך פעיל ומחכה לפניות';
  }

  function renderHub(d) {
    var live = d.workers.filter(function (w) { return w.isActive; }).length;
    var grace = d.workers.filter(function (w) { return w.inGrace; });
    var html = '';

    html += '<header><div class="brand">' + esc(d.business.name || 'העסק שלי') +
      '<small>הבית של העובד שלך</small></div>' +
      '<button class="btn ghost" id="out">יציאה</button></header>';

    if (grace.length) {
      html += '<div class="card banner"><b>המנוי הסתיים.</b> העובד ממשיך לענות ללקוחות עוד ' +
        'כמה ימים ואז יושהה. פנו אלינו לחידוש.</div>';
    }

    html += '<div class="card hero">' +
      '<h1>' + esc(headline(d)) + '</h1>' +
      '<p>' + (live === 1
        ? '✅ העובד שלך פעיל — עונה ללקוחות 24/7'
        : live > 1
          ? '✅ ' + live + ' עובדים פעילים — עונים ללקוחות 24/7'
          : '⏸ אין עובד פעיל כרגע') + '</p>' +
      '<div class="kpis">' +
        kpi(d.totals.messagesThisWeek, 'שיחות השבוע') +
        kpi(d.totals.newLeads, 'לידים') +
        kpi(d.totals.hotLeads, 'לידים חמים') +
        kpi(d.totals.openEscalations, 'מחכים לך') +
      '</div></div>';

    // Escalations first: these are people waiting on a human right now.
    html += '<div class="card"><h2>🔔 דורש אותך</h2>';
    if (!d.escalations.length) {
      html += '<div class="empty">אין פניות שממתינות לך — העובד סגר הכל לבד ✨</div>';
    } else {
      d.escalations.forEach(function (e) {
        html += '<div class="row"><div class="grow">' +
          '<strong>' + esc(e.reason || 'פנייה דחופה') + '</strong>' +
          '<div class="meta">' + esc(e.workerName) + ' · ' + esc(timeAgo(e.createdAt)) + '</div>' +
          '</div><span class="pill ' + (e.urgency === 'high' || e.urgency === 'critical' ? 'danger' : 'warn') +
          '">' + esc(e.urgency === 'critical' ? 'קריטי' : e.urgency === 'high' ? 'דחוף' : 'רגיל') +
          '</span></div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><h2>👤 לידים אחרונים</h2>';
    if (!d.leads.length) {
      html += '<div class="empty">עוד לא נקלטו לידים. ברגע שמישהו ישאיר פרטים — תקבלו התראה.</div>';
    } else {
      d.leads.forEach(function (l) {
        var acts = '';
        if (l.phone) {
          acts += '<a class="btn" href="' + esc(telHref(l.phone)) + '">📞 חיוג</a>' +
                  '<a class="btn" href="' + esc(waHref(l.phone)) + '" target="_blank" rel="noopener">💬</a>';
        }
        html += '<div class="row"><div class="grow">' +
          '<strong>' + esc(l.fullName || 'ליד חדש') +
          (l.score >= 7 ? ' <span class="pill ok">חם</span>' : '') + '</strong>' +
          '<div class="meta">' +
          [l.phone, l.email].filter(Boolean)
            .map(function (v) { return '<bdi>' + esc(v) + '</bdi>'; }).join(' · ') +
          (l.notes ? '<br>' + esc(String(l.notes).slice(0, 110)) : '') +
          '<br>' + esc(timeAgo(l.createdAt)) + '</div>' +
          '</div><div class="acts">' + acts + '</div></div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><h2>⚡ מה העובד עשה</h2>';
    if (!d.activity.length) {
      html += '<div class="empty">אין פעילות עדיין.</div>';
    } else {
      d.activity.slice(0, 10).forEach(function (a) {
        html += '<div class="row"><div class="grow">' +
          '<strong>' + esc(toolLabel(a.toolName)) + '</strong>' +
          '<div class="meta">' + esc(String(a.resultSummary || '').slice(0, 120)) +
          '<br>' + esc(timeAgo(a.createdAt)) + '</div></div></div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><h2>⚙️ החשבון שלי</h2>' +
      '<div class="row"><div class="grow"><strong>' + esc(d.business.plan.nameHe) + '</strong>' +
      '<div class="meta">' + d.account.used.toLocaleString('he-IL') + ' מתוך ' +
      d.account.limit.toLocaleString('he-IL') + ' הודעות החודש (' + d.account.pct + '%)</div>' +
      '</div></div>' +
      '<div class="row"><div class="grow"><strong>מכשירים מחוברים</strong>' +
      '<div class="meta" id="sess">טוען…</div></div>' +
      '<div class="acts"><button class="btn" id="revoke">נתק אחרים</button></div></div>' +
      '</div>';

    html += '<footer>יש בעיה עם תשובה של העובד? כתבו לנו ונתקן.<br>' +
      '<a href="/privacy">פרטיות</a> · <a href="/terms">תנאים</a></footer>';

    root.innerHTML = html;

    document.getElementById('out').addEventListener('click', function () {
      api('/api/auth/logout', { method: 'POST' }).then(function () { location.href = '/app'; });
    });
    document.getElementById('revoke').addEventListener('click', function () {
      api('/api/auth/sessions/revoke', { method: 'POST', body: { all: true } })
        .then(function () { loadSessions(); });
    });
    loadSessions();
  }

  function kpi(n, label) {
    return '<div class="kpi"><b>' + Number(n || 0).toLocaleString('he-IL') + '</b><span>' + label + '</span></div>';
  }

  var TOOL_LABELS = {
    save_lead: 'שמר ליד חדש',
    escalate_to_human: 'העביר פנייה אליך',
    book_appointment: 'קבע תור',
    check_availability: 'בדק זמינות',
    search_knowledge: 'חיפש תשובה בידע שלך',
    schedule_callback: 'תיאם שיחה חוזרת',
    create_crm_note: 'רשם סיכום שיחה',
    generate_image: 'יצר תמונה',
    notify_webhook: 'שלח התראה'
  };
  function toolLabel(name) { return TOOL_LABELS[name] || name || 'פעולה'; }

  function loadSessions() {
    api('/api/auth/sessions').then(function (r) {
      var el = document.getElementById('sess');
      if (!el) return;
      var list = (r.body.sessions || []);
      el.textContent = list.length
        ? list.map(function (s) { return s.device + (s.current ? ' (זה)' : ''); }).join(' · ')
        : 'אין';
    });
  }

  function load() {
    api('/api/hub/overview').then(function (r) {
      if (r.status === 401) { renderLogin(); return; }
      if (r.status !== 200) { renderLogin('משהו השתבש. נסו שוב.'); return; }
      renderHub(r.body);
    }).catch(function () { renderLogin('אין חיבור לשרת.'); });
  }

  load();
})();
</script>
